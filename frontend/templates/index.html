<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilverBank - Área Clientes</title>
    <style>
        :root {
            --banco-primario: #003366;
            --banco-secundario: #085696;
            --shield-acento: #f4a261;
            --fondo: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--fondo); margin: 0; transition: all 0.3s; }
        .navbar { background: var(--banco-primario); color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { margin: 0; display: flex; align-items: center; gap: 10px; }
        .controles-top { display: flex; gap: 15px; align-items: center; }
        .usuario-info { font-size: 14px; font-weight: bold; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 20px; }
        .btn-accesibilidad { background: white; color: var(--banco-primario); border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-accesibilidad:hover { background: #eee; }
        .container { max-width: 1000px; margin: 40px auto; display: flex; gap: 25px; padding: 0 20px; flex-wrap: wrap; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex: 1; min-width: 320px; transition: all 0.3s; }
        .card h3 { color: var(--banco-primario); margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; background-color: #fdfdfd; font-family: inherit; font-size: 14px; }
        input[type="text"]:focus { outline: none; border-color: var(--banco-secundario); }
        .btn-transfer { background: var(--banco-secundario); color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-transfer:hover:not(:disabled) { background: var(--banco-primario); }
        .btn-transfer:disabled { cursor: not-allowed; opacity: 0.9; }
        .btn-familiar { background: #2ecc71; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; display: none; transition: 0.3s; }
        .btn-familiar:hover { background: #27ae60; }
        .shield-header { display: flex; align-items: center; gap: 10px; color: #2c3e50; margin-bottom: 5px; justify-content: center; }
        .shield-header h2 { margin: 0; }
        textarea { width: 100%; height: 90px; padding: 12px; border: 2px solid #eee; border-radius: 6px; box-sizing: border-box; resize: vertical; margin-bottom: 15px; font-family: inherit; font-size: 15px;}
        textarea:focus { outline: none; border-color: var(--shield-acento); }
        .botones-accion { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-shield { color: white; border: none; padding: 15px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; flex: 1; }
        .btn-texto { background: var(--shield-acento); }
        .btn-texto:hover:not(:disabled) { background: #e76f51; }
        .btn-micro { background: #2ecc71; }
        .btn-micro:hover:not(:disabled) { background: #27ae60; }
        .btn-micro.grabando { background: #e74c3c; animation: latido 1.5s infinite; }
        @keyframes latido { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        #resultado { padding: 15px; border-radius: 5px; display: none; font-weight: bold; line-height: 1.5; font-size: 16px; margin-top: 15px; overflow-wrap: break-word; text-align: left; }
        .alerta { background: #ffebee; border-left: 8px solid #f44336; color: #b71c1c; }
        .seguro { background: #e8f5e9; border-left: 8px solid #4caf50; color: #1b5e20; }
        .error { background: #fff3e0; border-left: 8px solid #ff9800; color: #e65100; }
        body.modo-accesible { font-size: 120%; }
        body.modo-accesible .card { border: 2px solid #333; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        body.modo-accesible input[type="text"], body.modo-accesible textarea, body.modo-accesible button { font-size: 110%; border: 2px solid #666; }
        body.modo-accesible label { font-size: 110%; color: #000; }
        body.modo-accesible .alerta { font-size: 120%; border-left-width: 12px; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>🏦 SilverBank</h2>
        <div class="controles-top">
            <button class="btn-accesibilidad" onclick="toggleAccesibilidad()">🔍 A+ Letra Grande</button>
            <div class="usuario-info">👤 Juan Pérez | Saldo: 4.520,00 €</div>
        </div>
    </div>
    
    <div class="container">
        <!-- Panel Bancario interactivo -->
        <div class="card">
            <h3>Nueva Transferencia</h3>
            <div class="form-group">
                <label>Destinatario (IBAN)</label>
                <input type="text" id="ibanDestino" placeholder="Ej: ES91 2100 0418...">
            </div>
            <div class="form-group">
                <label>Importe a transferir (€)</label>
                <input type="text" id="importeTransferencia" placeholder="Ej: 700,00 €">
            </div>
            <div class="form-group">
                <label>Concepto</label>
                <input type="text" id="conceptoTransferencia" placeholder="Ej: Pago multa o bombilla">
            </div>
            <button class="btn-transfer" id="btnTransferencia" onclick="alert('Iniciando proceso de transferencia...')">Confirmar Transferencia</button>
            <button class="btn-familiar" id="btnFamiliar" onclick="simularLlamada()">📞 Llamar a mi hijo/a (Contacto Seguro)</button>
        </div>

        <!-- Módulo IA Híbrido -->
        <div class="card" style="display: flex; flex-direction: column; justify-content: center; text-align: center;">
            <div class="shield-header">
                <h2>🛡️ SilverShield IA</h2>
            </div>
            <p style="color: #7f8c8d; font-size: 15px; margin-bottom: 20px;">Dime en voz alta o escribe lo que te están pidiendo hacer.</p>
            
            <textarea id="textoUsuario" placeholder="Ej: Me ha llamado el técnico de Microsoft y me pide descargar AnyDesk..."></textarea>
            
            <div class="botones-accion">
                <button id="btnMicrofono" class="btn-shield btn-micro" onclick="iniciarGrabacion()">
                    🎙️ Hablar
                </button>
                <button id="btnSimular" class="btn-shield btn-texto" onclick="procesarTexto()">
                    📝 Enviar Texto
                </button>
            </div>

            <div id="resultado"></div>
            <div id="medidorEstres" style="display: none; margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 15px;"></div>
        </div>

        <!-- Panel de Administración (Base de Datos) -->
        <div class="card" style="min-width: 100%; margin-top: 10px; background: #eef2f5;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="color: #2c3e50; font-size: 16px; margin: 0; border: none; padding: 0;">📊 Log de Seguridad del Banco (Base de Datos)</h3>
                <button onclick="limpiarBaseDatos()" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s;">🗑️ Limpiar Historial</button>
            </div>
            <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                <thead>
                    <tr style="background: var(--banco-primario); color: white;">
                        <th style="padding: 10px; text-align: left;">Fecha</th>
                        <th style="padding: 10px; text-align: left;">Texto Capturado</th>
                        <th style="padding: 10px; text-align: left;">Estrés</th>
                        <th style="padding: 10px; text-align: center;">Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaHistorial">
                    <!-- Se rellena por JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function toggleAccesibilidad() { document.body.classList.toggle("modo-accesible"); }

        let reconocimiento;
        let grabando = false;
        let volumenDetectadoAlto = false;
        
        let audioContext;
        let analyser;
        let dataArray;
        let mediaStreamSource;

        const btnMicro = document.getElementById("btnMicrofono");
        const btnSimular = document.getElementById("btnSimular");
        const areaTexto = document.getElementById("textoUsuario");

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            reconocimiento = new SpeechRecognition();
            reconocimiento.lang = 'es-ES';
            reconocimiento.interimResults = false;

            reconocimiento.onstart = function() {
                grabando = true;
                volumenDetectadoAlto = false; 
                btnMicro.innerHTML = "🎙️ Escuchando...";
                btnMicro.classList.add("grabando");

                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    mediaStreamSource = audioContext.createMediaStreamSource(stream);
                    mediaStreamSource.connect(analyser);
                    analyser.fftSize = 256;
                    const bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);
                    medirVolumen();
                }).catch(err => console.log("Permiso de micro denegado para análisis de volumen."));
            };

            reconocimiento.onresult = function(event) {
                areaTexto.value = event.results[0][0].transcript;
            };

            reconocimiento.onerror = function(event) {
                detenerInterfazGrabacion();
                alert("Error de micrófono. Inténtalo de nuevo.");
            };

            reconocimiento.onend = function() {
                detenerInterfazGrabacion();
                if (areaTexto.value.trim() !== "") {
                    procesarTexto();
                }
            };
        } else {
            alert("Tu navegador no soporta reconocimiento de voz. Usa la caja de texto.");
        }

        function medirVolumen() {
            if (!grabando) return;
            analyser.getByteFrequencyData(dataArray);
            let suma = 0;
            for(let i = 0; i < dataArray.length; i++) { suma += dataArray[i]; }
            let promedio = suma / dataArray.length;
            
            if (promedio > 50) { 
                volumenDetectadoAlto = true; 
            }
            requestAnimationFrame(medirVolumen);
        }

        function iniciarGrabacion() {
            if (grabando) { 
                reconocimiento.stop(); 
            } else { 
                areaTexto.value = ""; 
                reconocimiento.start(); 
            }
        }

        function detenerInterfazGrabacion() {
            grabando = false;
            btnMicro.innerHTML = "🎙️ Hablar";
            btnMicro.classList.remove("grabando");
        }

        async function procesarTexto() {
            const texto = areaTexto.value;
            const divResultado = document.getElementById("resultado");
            const btnTransfer = document.getElementById("btnTransferencia");
            const btnFamiliar = document.getElementById("btnFamiliar");
            const divEstres = document.getElementById("medidorEstres");

            if (!texto.trim()) {
                alert("Por favor, escribe el contexto o usa el micrófono.");
                return;
            }

            btnMicro.disabled = true;
            btnSimular.innerHTML = "⏳ Analizando...";
            btnSimular.style.background = "#ccc";
            btnSimular.disabled = true;
            
            divResultado.style.display = "none";
            divResultado.className = "";
            btnFamiliar.style.display = "none";
            divEstres.style.display = "none";

            try {
                const response = await fetch("/analizar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ texto: texto, volumen_alto: volumenDetectadoAlto })
                });

                const datos = await response.json();
                divResultado.style.display = "block";

                if (datos.exito) {
                    divResultado.innerText = datos.advertencia;

                    if (datos.nivel_estres) {
                        divEstres.style.display = "block";
                        divEstres.innerText = "Estado del usuario: " + datos.nivel_estres;
                        
                        if (datos.nivel_estres.includes("Pánico")) {
                            divEstres.style.backgroundColor = "#ffebee"; divEstres.style.color = "#c62828";
                        } else if (datos.nivel_estres.includes("Nerviosismo")) {
                            divEstres.style.backgroundColor = "#fff9c4"; divEstres.style.color = "#f57f17";
                        } else {
                            divEstres.style.backgroundColor = "#e8f5e9"; divEstres.style.color = "#2e7d32";
                        }
                    }

                    if (datos.advertencia.includes("Análisis seguro")) {
                        divResultado.className = "seguro";
                        btnTransfer.disabled = false;
                        btnTransfer.style.background = "var(--banco-secundario)";
                        btnTransfer.innerText = "Confirmar Transferencia";
                    } else {
                        divResultado.className = "alerta";
                        btnTransfer.disabled = true;
                        btnTransfer.style.background = "#e74c3c";
                        btnTransfer.innerText = "🚫 Bloqueada por Seguridad";
                        
                        btnFamiliar.style.display = "block";
                        btnFamiliar.innerHTML = "📞 Llamar a mi hijo/a (Contacto Seguro)";
                        btnFamiliar.style.background = "#2ecc71";

                        if (datos.audio_base64) {
                            const audio = new Audio("data:audio/mpeg;base64," + datos.audio_base64);
                            audio.play().catch(e => console.log("Auto-play bloqueado."));
                        }
                    }
                }
            } catch (error) {
                divResultado.style.display = "block";
                divResultado.innerText = "Error de conexión con el servidor.";
                divResultado.className = "error";
            } finally {
                btnMicro.disabled = false;
                btnSimular.innerHTML = "📝 Enviar Texto";
                btnSimular.style.background = "var(--shield-acento)";
                btnSimular.disabled = false;
                volumenDetectadoAlto = false;
                
                cargarHistorial(); 
            }
        }

        function simularLlamada() {
            const btn = document.getElementById("btnFamiliar");
            btn.innerHTML = "📞 Conectando con tu hijo/a...";
            btn.style.background = "#f39c12"; 
            setTimeout(() => {
                btn.innerHTML = "🗣️ Llamada en curso (00:01)";
                btn.style.background = "#27ae60"; 
            }, 2000);
        }

        async function cargarHistorial() {
            try {
                const response = await fetch("/historial");
                const datos = await response.json();
                const tbody = document.getElementById("tablaHistorial");
                tbody.innerHTML = "";
                
                datos.historial.forEach(registro => {
                    const fila = document.createElement("tr");
                    fila.style.borderBottom = "1px solid #ccc";
                    
                    const badgeEstado = registro.bloqueado 
                        ? '<span style="background:#e74c3c; color:white; padding:4px 8px; border-radius:10px; font-weight:bold;">BLOQUEADO</span>'
                        : '<span style="background:#2ecc71; color:white; padding:4px 8px; border-radius:10px; font-weight:bold;">PERMITIDO</span>';

                    fila.innerHTML = `
                        <td style="padding: 10px;">${registro.fecha}</td>
                        <td style="padding: 10px; font-style: italic;">"${registro.texto}"</td>
                        <td style="padding: 10px;">${registro.estres}</td>
                        <td style="padding: 10px; text-align: center;">${badgeEstado}</td>
                    `;
                    tbody.appendChild(fila);
                });
            } catch (error) {
                console.log("Error cargando historial de la base de datos.");
            }
        }

        async function limpiarBaseDatos() {
            if (confirm("¿Estás seguro de borrar todo el historial de seguridad?")) {
                await fetch("/limpiar-historial", { method: "DELETE" });
                cargarHistorial();
            }
        }

        window.onload = cargarHistorial;
    </script>
</body>
</html>
